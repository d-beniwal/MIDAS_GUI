name: midas-gui
channels:
  - pytorch
  - conda-forge
  - defaults

dependencies:
  # ── Python ───────────────────────────────────────────────────────────────
  - python=3.12

  # ── PyTorch (CPU build; swap for pytorch-cuda=12.1 for GPU support) ─────
  - pytorch>=2.0
  - cpuonly                     # remove this line and add pytorch-cuda=XX.X for GPU

  # ── Scientific stack ─────────────────────────────────────────────────────
  - numpy>=1.24
  - scipy>=1.10
  - h5py>=3.8
  - tifffile>=2023.1

  # ── GUI ──────────────────────────────────────────────────────────────────
  - pyqtgraph>=0.13
  - matplotlib-base>=3.5        # supplies pyqtgraph's named colormaps (hot/viridis/…)
  - pip                         # needed to install PyQt5 and MIDAS packages

  - pip:
    # PyQt5 is more reliably installed via pip than conda on macOS/Linux
    - "PyQt5>=5.15"

    # ── midas-gui itself + its MIDAS backends ────────────────────────────
    # Editable install of this cloned repo (path is relative to the repo root,
    # where you run `conda env create -f environment.yml`). This pulls exactly the
    # MIDAS analysis packages the GUI imports — midas-calibrate-v2, midas-integrate-v2,
    # midas-calibrate, midas-hkls, midas-distortion — declared in pyproject.toml.
    #
    # NOTE: do NOT add the `midas_suite` meta-package here. It drags in extra packages
    # the GUI never uses (midas-index/stress/params/…), and midas-index currently ships
    # only an sdist that fails to build against scikit-build-core>=0.8, which aborts the
    # whole env creation. If you separately need the full suite, install it in another
    # environment.
    - "-e ."
