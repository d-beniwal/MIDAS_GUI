name: midas-gui
channels:
  - pytorch
  - conda-forge
  - defaults

dependencies:
  # ── Python ───────────────────────────────────────────────────────────────
  - python=3.12

  # ── PyTorch (CPU build; swap for pytorch-cuda=12.1 for GPU support) ─────
  - pytorch>=2.0
  - cpuonly                     # remove this line and add pytorch-cuda=XX.X for GPU

  # ── Scientific stack ─────────────────────────────────────────────────────
  - numpy>=1.24
  - scipy>=1.10
  - h5py>=3.8
  - tifffile>=2023.1

  # ── GUI ──────────────────────────────────────────────────────────────────
  - pyqtgraph>=0.13
  - matplotlib-base>=3.5        # supplies pyqtgraph's named colormaps (hot/viridis/…)
  - pip                         # needed to install PyQt5 and MIDAS packages

  - pip:
    # PyQt5 is more reliably installed via pip than conda on macOS/Linux
    - "PyQt5>=5.15"

    # ── midas-gui itself ─────────────────────────────────────────────────
    # Editable install of this cloned repo (path is relative to the repo root,
    # where you run `conda env create -f environment.yml`).
    - "-e ."

    # ── MIDAS analysis backend ───────────────────────────────────────────
    # All MIDAS analysis packages the GUI drives (midas-calibrate-v2,
    # midas-integrate-v2, midas-calibrate, midas-hkls, midas-distortion) are
    # provided by the midas-suite meta-package.
    - "midas_suite"
